<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Joanna Raymond Ruiz | Location Blog Philly</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Interactive map of Philadelphia with sketches and location descriptions">
<title>Philadelphia Sketch Map</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>Philly Map</h1>
</header>

<main class="map-container">

  <!-- MAP IMAGE -->
  <img src="images/map.png"
       alt="Illustrated map of Philadelphia"
       title="Map of Philadelphia"
       class="map">

  <!-- SKETCH 1 -->
  <a href="#loc1" class="sketch s1" title="White Dog Café">
    <img src="images/white-dog.jpg"
         alt="Picture of white dog café, a place for brunch with happy hours and very good!"
         title="White dog Cafe">
  </a>

  <!-- SKETCH 2 -->
  <a href="#loc2" class="sketch s2" title="Sabrina's Cafe">
    <img src="images/sabrinas.jpg"
         alt="Interior of Sabrina's Cafe!"
         title="Sabrina's Cafe">
  </a>

  <!-- SKETCH 3 -->
  <a href="#loc3" class="sketch s3">
    <img src="images/eltaco.jpg"
         alt="Picture of El Taco"
         title="El taco">
  </a>

  <!-- SKETCH 4 -->
  <a href="#loc4" class="sketch s4">
    <img src="images/madis.png"
         alt="Picture of Madis Cafe"
         title="Madis Café in Drexel">
  </a>

  <!-- SKETCH 5 -->
  <a href="#loc5" class="sketch s5">
    <img src="images/terakawa.png"
         alt="Sketch of South Street"
         title="South Street sketch">
  </a>

</main>

<!-- POPUPS -->

<div id="loc1" class="popup">
  <h2>White Dog Cafe</h2>
  <img src="images/white-dog.jpg" alt="White Dog Cafe underground room in green photo">
  <p>Great happy hour and super good fries!</p>
  <a href="#" class="close">Close</a>
</div>

<div id="loc2" class="popup">
  <h2>Sabrina's Cafe</h2>
  <img src="images/sabrinas.jpg" alt="Sabrina's Cafe entrance in Drexel! photo">
  <p>Super good for brunch and great french toast.</p>
  <a href="#" class="close">Close</a>
</div>

<div id="loc3" class="popup">
  <h2>El Taco</h2>
  <img src="images/eltaco.jpg" alt="El taco food photo">
  <p>Great affordable tacos!</p>
  <a href="#" class="close">Close</a>
</div>

<div id="loc4" class="popup">
  <h2>Madis Cafe</h2>
  <img src="images/madis.png" alt="Madis Cafe photo with people studying">
  <p>Super good coffee and study spot.</p>
  <a href="#" class="close">Close</a>
</div>

<div id="loc5" class="popup">
  <h2>Terakawa</h2>
  <img src="images/terakawa.png" alt="Terakawa, a ramen place in university city. A picture of the food offered">
  <p>Great for ramen!.</p>
  <a href="#" class="close">Close</a>
</div>

</body>
</html>
